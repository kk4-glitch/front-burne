name: buy-and-burn

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 UTC
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write           # lets the run commit burns.json back to the repo

concurrency:
  group: buy-and-burn
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Claim, buy, burn
        run: node burn.mjs
        env:
          BURN_WALLET_KEY: ${{ secrets.BURN_WALLET_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          MINT: ${{ vars.MINT }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          POOL_SHARE: ${{ vars.POOL_SHARE || '0.70' }}
          SLIPPAGE: ${{ vars.SLIPPAGE || '10' }}
          PRIORITY_FEE: ${{ vars.PRIORITY_FEE || '0.0005' }}
          MAX_BUY_SOL: ${{ vars.MAX_BUY_SOL || '1' }}
          MIN_BUY_SOL: ${{ vars.MIN_BUY_SOL || '0.01' }}
          KEEP_SOL: ${{ vars.KEEP_SOL || '0.02' }}
      - name: Commit the burn log
        if: always()
        run: |
          git config user.name "front-burner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add burns.json
          if git diff --cached --quiet; then echo "Nothing new to record"; exit 0; fi
          git commit -m "burn log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
